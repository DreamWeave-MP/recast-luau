# recast-luau as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `recast-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "9b956581-d9f4-4a41-b46b-3e70dca1f086"
slug = "recast"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.recast"

[[releases]]
version = "0.2.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
