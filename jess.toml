manifest_version = 1

[package]
id = "org.dreamweave.recast"
version = "0.2.0"
jess_api = "1"
include = ["src", "examples", "bench", "tests", "RECAST-LICENSE.txt", "README.md"]
tests = ["tests/recast_spec.jsl", "tests/detour_spec.jsl", "tests/crowd_spec.jsl", "tests/proximity_grid_spec.jsl", "tests/obstacle_avoidance_spec.jsl", "tests/local_boundary_spec.jsl", "tests/path_corridor_spec.jsl", "tests/path_queue_spec.jsl", "tests/tilecache_spec.jsl", "tests/navmesh_spec.jsl", "tests/navmesh_builder_spec.jsl", "tests/bv_tree_order_spec.jsl", "tests/detail_mesh_spec.jsl", "tests/tiled_navmesh_spec.jsl", "tests/tile_writer_spec.jsl", "tests/compact_navmesh_spec.jsl", "tests/query_filter_spec.jsl", "tests/region_overlap_spec.jsl"]

[modules]
"@recast/common" = "src/common.jsl"
"@recast/core" = "src/recast.jsl"
"@recast/detour" = "src/detour.jsl"
"@recast/detail" = "src/detail.jsl"
"@recast/crowd" = "src/crowd.jsl"
"@recast/proximity-grid" = "src/proximity_grid.jsl"
"@recast/obstacle-avoidance" = "src/obstacle_avoidance.jsl"
"@recast/local-boundary" = "src/local_boundary.jsl"
"@recast/path-corridor" = "src/path_corridor.jsl"
"@recast/path-queue" = "src/path_queue.jsl"
"@recast/tilecache" = "src/tilecache.jsl"
"@recast/navmesh" = "src/navmesh.jsl"
"@recast/navmesh-builder" = "src/navmesh_builder.jsl"
"@recast" = "src/init.jsl"

[[layer]]
id = "org.dreamweave.recast"
requires = []
exports = ["@recast", "@recast/core", "@recast/detail", "@recast/detour", "@recast/crowd", "@recast/proximity-grid", "@recast/obstacle-avoidance", "@recast/local-boundary", "@recast/path-corridor", "@recast/path-queue", "@recast/tilecache", "@recast/navmesh", "@recast/navmesh-builder", "@recast/common"]
